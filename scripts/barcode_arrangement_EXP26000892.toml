# Dorado custom barcode arrangement — EXP26000892_cDNA003 (HBV RNA enrichment pilot)
#
# Double-ended, SYMMETRIC barcode (the same 24-nt index is on both the fwd and rev1
# PCR primer of a pair), with ASYMMETRIC flanks (the front construct is P5-side and
# runs into SSPII; the rear construct is P7-side and runs into the CRTA primer).
#
# Architecture, verified base-for-base against all 8 ordered oligos (MWolig0127-0134):
#
#   5' [ONT LSK adapter]
#      AATGATACGGCGACCACCGA GGTGCTG [BC 24nt] TTAACCT TTTCTGTTGGTGCTGATATTGC...
#      |------- P5 -------| |mask1_front cont|          |--- SSPII + 28nt UMI ---|
#      ... cDNA / HBV insert ...
#      ... CRTA ... rc( TTAACCT CTTGCCTGTCGCTCTATC ) rc([BC]) rc( GGTGCTG rc(P7) )
#      [ONT LSK adapter] 3'
#
# Dorado's double-ended model is:
#   5' ADAPTER - LEADING_FLANK_1 - BARCODE_1 - TRAILING_FLANK_1 - READ
#      - RC(TRAILING_FLANK_2) - RC(BARCODE_2) - RC(LEADING_FLANK_2) - 3'
# so mask2_* are given in FORWARD orientation (as they read in the rev1 primer);
# dorado reverse-complements them itself when it searches the rear window.

[arrangement]
name = "EXP26000892"
kit = "EXP26000892"
# Deliberately NOT setting `kit`. See the runner script: in dorado 1.2-1.3 passing
# --kit-name alongside --barcode-arrangement can cause the custom arrangement to be
# silently ignored (nanoporetech/dorado#1548). Leaving this unset and omitting
# --kit-name is the safe configuration.

# ---- front barcode construct (P5 side) ----
mask1_front = "AATGATACGGCGACCACCGAGGTGCTG"        # P5 (20) + GGTGCTG (7)
mask1_rear  = "TTAACCTTTTCTGTTGGTGCTGATATTGC"      # TTAACCT (7) + SSPII 5' (22)

# ---- rear barcode construct (P7 side), forward orientation ----
mask2_front = "CAAGCAGAAGACGGCATACGAGATGGTGCTG"    # rc(P7) (24) + GGTGCTG (7)
mask2_rear  = "TTAACCTCTTGCCTGTCGCTCTATC"          # TTAACCT (7) + CRTA-side primer 5' (18)

# ---- barcode sequences: same set at both ends (symmetric) ----
barcode1_pattern = "MW%02i"
barcode2_pattern = "MW%02i"
first_index = 1
last_index  = 4

[scoring]
# Thresholds are derived from the MEASURED separation of this barcode set, not guessed.
# Pairwise edit distances among the 4 barcodes: 12,12,13,14,14,14,15 -> minimum 12.
# A min pairwise distance of 12 means errors up to floor((12-1)/2) = 5 are ALWAYS
# unambiguously correctable, so a penalty ceiling of 6 sits right at the theoretical
# boundary while a top-2 gap of 4 is very conservative (the true and next-best barcode
# would have to converge by 8+ edits for a misassignment).
max_barcode_penalty      = 6
min_barcode_penalty_dist = 4
min_separation_only_dist = 6

# Flank padding: bases of adjacent flank folded into the barcode alignment.
flank_left_pad  = 5
flank_right_pad = 5

# Search windows. Measured construct end (mask1_front 27 + barcode 24 + mask1_rear 29):
#   LSK adapter trimmed      -> construct ends  ~80 bp into the read
#   LSK adapter NOT trimmed  -> construct ends ~140 bp into the read (~60 bp leader)
# We pass --no-trim to dorado demux, so whatever is in bam_pass is preserved; if the
# adapter was not trimmed at basecall time the ~140 bp case is the REAL one. An earlier
# barcode_end_proximity of 150 left only 10 bp of margin there, which a slightly longer
# leader would break (silently, as unclassified reads). Set to 200 to match the window.
front_barcode_window  = 200
rear_barcode_window   = 200
barcode_end_proximity = 200

# Flank score = 1 - edit_distance/flank_length. These flanks are long (25-31 bp), so
# 0.6 tolerates ~10-12 flank errors — appropriate for nanopore, and specific enough
# that random sequence will not produce a window.
min_flank_score     = 0.6
midstrand_flank_score = 0.95
